[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revocable-flow"
version = "0.2.0"
description = "Synthetic benchmark for dynamic privacy permissions in tool-using LLM agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
revocable-flow = "revocable_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
