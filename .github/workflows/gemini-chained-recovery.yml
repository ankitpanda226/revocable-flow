{
  "name": "Gemini single-request chained recovery",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_run_id": {
          "description": "Existing failed two-request recovery run ID (not original sanity run)",
          "required": true,
          "type": "string"
        },
        "source_attempt": {
          "description": "Source run attempt number",
          "required": true,
          "default": "1",
          "type": "string"
        },
        "budget_review_confirmed": {
          "description": "I reviewed the $4 total budget and approve one new call; source not already recovered",
          "required": true,
          "default": false,
          "type": "boolean"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "gemini-chained-${{ inputs.source_run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "recovery": {
      "if": "github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.budget_review_confirmed",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {
        "PYTHONPATH": "src",
        "SOURCE_GITHUB_RUN": "${{ inputs.source_run_id }}",
        "SOURCE_ATTEMPT": "${{ inputs.source_attempt }}",
        "SOURCE_RUN_ID": "gh-gemini-recovery-${{ inputs.source_run_id }}-${{ inputs.source_attempt }}",
        "RECOVERY_ID": "gh-gemini-chained-${{ github.run_id }}-1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install project",
          "run": "python -m pip install ."
        },
        {
          "name": "Offline tests and frozen benchmark validation",
          "run": "python -m unittest discover -s tests -v\npython -m revocable_flow.cli validate data/pilot/scenarios.jsonl --pilot"
        },
        {
          "name": "Verify source workflow identity",
          "id": "source",
          "uses": "actions/github-script@v7",
          "with": {
            "script": "const runId = process.env.SOURCE_GITHUB_RUN;\nconst attempt = process.env.SOURCE_ATTEMPT;\nif (!/^[1-9][0-9]*$/.test(runId) || !/^[1-9][0-9]*$/.test(attempt)) throw new Error('Invalid source identity');\nif (Number(attempt) !== 1 || !Number.isSafeInteger(Number(runId))) throw new Error('Invalid first-recovery attempt');\nconst { data: run } = await github.rest.actions.getWorkflowRunAttempt({owner: context.repo.owner, repo: context.repo.repo, run_id: Number(runId), attempt_number: Number(attempt)});\nif (run.path !== '.github/workflows/gemini-recovery.yml' || run.event !== 'workflow_dispatch' || run.head_branch !== 'main' || run.conclusion !== 'failure' || run.status !== 'completed' || run.run_attempt !== Number(attempt)) throw new Error('Not the specified failed manual first recovery');\nif (!/^[0-9a-f]{40}$/.test(run.head_sha)) throw new Error('Invalid source commit');\ncore.setOutput('commit', run.head_sha);"
          }
        },
        {
          "name": "Download existing source artifact only",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "gemini-recovery-results",
            "path": "${{ runner.temp }}/chained-input",
            "github-token": "${{ github.token }}",
            "repository": "${{ github.repository }}",
            "run-id": "${{ inputs.source_run_id }}"
          }
        },
        {
          "name": "Validate full chain and run only original index 2",
          "id": "recover",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
            "GITHUB_TOKEN": "${{ github.token }}",
            "SOURCE_COMMIT": "${{ steps.source.outputs.commit }}"
          },
          "run": "python -m revocable_flow.recovery --from-recovery --source \"$RUNNER_TEMP/chained-input\" --source-run-id \"$SOURCE_RUN_ID\" --source-commit \"$SOURCE_COMMIT\" --run-id \"$RECOVERY_ID\" --destination \"$RUNNER_TEMP/chained-preserved\" --execute-live"
        },
        {
          "name": "Inspect source preservation and safe recovery artifacts",
          "id": "artifacts",
          "if": "${{ always() && steps.recover.outcome != 'skipped' && steps.recover.outcome != '' }}",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python .github/scripts/stage_gemini_chained_recovery.py"
        },
        {
          "name": "Upload inspected original and recovery artifacts",
          "if": "${{ always() && steps.artifacts.outputs.safe == 'true' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "gemini-chained-recovery-results",
            "path": "${{ runner.temp }}/chained-upload/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
