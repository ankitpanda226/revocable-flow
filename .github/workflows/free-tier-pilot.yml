{
  "name": "Gemini Flash-Lite staged pilot (disabled pending evidence)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "phase": {
          "description": "Prospective phase; all live execution currently disabled",
          "type": "choice",
          "required": true,
          "default": "connectivity",
          "options": [
            "connectivity",
            "small_pilot",
            "remaining_post",
            "paired_pre"
          ]
        },
        "prior_run_id": {
          "description": "Immediate prior completed stage run ID; empty for connectivity",
          "type": "string",
          "required": false
        },
        "budget_review_confirmed": {
          "description": "I verified free-tier account eligibility, quota, cumulative spending below $4, and no prior duplicate stage",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "reviewed_total_spend_usd": {
          "description": "Verified actual cumulative all-provider USD spend, not an estimate",
          "type": "string",
          "required": true,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "readiness": {
      "if": "github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.budget_review_confirmed",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "env": {
        "PYTHONPATH": "src",
        "PHASE": "${{ inputs.phase }}",
        "RUN_ID": "gh-flash-lite-${{ github.run_id }}-1",
        "PRIOR_RUN_ID": "${{ inputs.prior_run_id }}",
        "BUDGET_APPROVED": "${{ inputs.budget_review_confirmed }}",
        "REVIEWED_SPEND_USD": "${{ inputs.reviewed_total_spend_usd }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install project",
          "run": "python -m pip install ."
        },
        {
          "name": "Offline tests and benchmark validation",
          "run": "python -m unittest discover -s tests -v\npython -m revocable_flow.cli validate data/pilot/scenarios.jsonl --pilot"
        },
        {
          "name": "Check independently verified evidence before any execution",
          "run": "python .github/scripts/free_tier_preflight.py",
          "id": "preflight"
        },
        {
          "name": "Reject duplicate dispatch and verify immediate prior workflow",
          "uses": "actions/github-script@v7",
          "with": {
            "script": "const guard = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/free_tier_dispatch_guard.js'); await guard({github, context, core, phase:process.env.PHASE, priorRunId:process.env.PRIOR_RUN_ID});"
          },
          "id": "previous"
        },
        {
          "name": "Download previous stage and ancestry",
          "if": "${{ inputs.prior_run_id != '' }}",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "flash-lite-pilot-results",
            "path": "${{ runner.temp }}/flash-lite-history",
            "github-token": "${{ github.token }}",
            "repository": "${{ github.repository }}",
            "run-id": "${{ inputs.prior_run_id }}"
          }
        },
        {
          "name": "Run only explicitly selected bounded phase",
          "id": "run",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
            "PRIOR_COMMIT": "${{ steps.previous.outputs.commit }}"
          },
          "run": "python .github/scripts/run_free_tier_phase.py"
        },
        {
          "name": "Inspect safe experiment artifacts",
          "id": "artifacts",
          "if": "${{ always() && steps.preflight.outcome == 'success' && steps.run.outcome != 'skipped' && steps.run.outcome != '' }}",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python .github/scripts/stage_free_tier_phase.py"
        },
        {
          "name": "Upload inspected stage and preserved ancestors",
          "if": "${{ always() && steps.artifacts.outputs.safe == 'true' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "flash-lite-pilot-results",
            "path": "${{ runner.temp }}/flash-lite-upload/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  },
  "concurrency": {
    "group": "flash-lite-pilot-v1",
    "cancel-in-progress": false
  }
}
