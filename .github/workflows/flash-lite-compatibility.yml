{
  "name": "Flash-Lite Phase 1 compatibility (one request only)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "one_request_approved": {
          "description": "I explicitly authorize ONE compatibility generation request with all four unverified parameters; no retry",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "key_project_binding_confirmed": {
          "description": "I verified GOOGLE_API_KEY in GitHub belongs to Default Gemini Project",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "free_tier_no_paid_billing_confirmed": {
          "description": "I rechecked that this key project is Free tier with no paid billing configured",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "quota_review_confirmed": {
          "description": "I reviewed current Flash-Lite RPM/TPM/RPD quota and usage for this one request",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "all_provider_budget_review_confirmed": {
          "description": "I reconciled actual all-provider research spending below $4; request caps are not dollar guarantees",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "reviewed_spend_usd": {
          "description": "Reviewed actual cumulative all-provider USD spend; unknown values must stop",
          "type": "string",
          "required": true,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "flash-lite-pilot-v1",
    "cancel-in-progress": false
  },
  "jobs": {
    "compatibility": {
      "if": "github.ref == 'refs/heads/main' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "env": {
        "PYTHONPATH": "src",
        "RUN_ID": "gh-flash-lite-compat-${{ github.run_id }}-1",
        "REVIEWED_SPEND_USD": "${{ inputs.reviewed_spend_usd }}",
        "ONE_REQUEST_APPROVED": "${{ inputs.one_request_approved }}",
        "KEY_PROJECT_BINDING_CONFIRMED": "${{ inputs.key_project_binding_confirmed }}",
        "FREE_TIER_NO_PAID_BILLING_CONFIRMED": "${{ inputs.free_tier_no_paid_billing_confirmed }}",
        "QUOTA_REVIEW_CONFIRMED": "${{ inputs.quota_review_confirmed }}",
        "ALL_PROVIDER_BUDGET_REVIEW_CONFIRMED": "${{ inputs.all_provider_budget_review_confirmed }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install project",
          "run": "python -m pip install ."
        },
        {
          "name": "Offline tests and frozen benchmark validation",
          "run": "python -m unittest discover -s tests -v\npython -m revocable_flow.cli validate data/pilot/scenarios.jsonl --pilot"
        },
        {
          "name": "Validate exact one-request authorization and budget",
          "id": "preflight",
          "run": "python .github/scripts/flash_lite_compatibility.py check"
        },
        {
          "name": "Reject any prior attempted compatibility dispatch",
          "uses": "actions/github-script@v7",
          "with": {
            "script": "const guard=require(process.env.GITHUB_WORKSPACE+'/.github/scripts/free_tier_dispatch_guard.js'); await guard({github,context,core,phase:'connectivity',priorRunId:'',workflowId:'flash-lite-compatibility.yml',executionStep:'Execute exactly one compatibility request'});"
          }
        },
        {
          "name": "Execute exactly one compatibility request",
          "id": "run",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}"
          },
          "run": "python .github/scripts/flash_lite_compatibility.py run --execute-live"
        },
        {
          "name": "Inspect safe artifacts including provider failures",
          "id": "artifacts",
          "if": "${{ always() && steps.preflight.outcome == 'success' && steps.run.outcome != 'skipped' && steps.run.outcome != '' }}",
          "env": {
            "GOOGLE_API_KEY": "${{ secrets.GOOGLE_API_KEY }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python .github/scripts/flash_lite_compatibility.py archive"
        },
        {
          "name": "Upload inspected compatibility artifacts",
          "if": "${{ always() && steps.artifacts.outputs.safe == 'true' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "flash-lite-compatibility-results",
            "path": "${{ runner.temp }}/compatibility-upload/",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
