{
  "name": "Preserve verified Flash-Lite diagnostic (read-only)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "preserve": {
      "if": "github.ref == 'refs/heads/main' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "env": {
        "PYTHONPATH": "src"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install project",
          "run": "python -m pip install ."
        },
        {
          "name": "Verify fixed source run provenance",
          "uses": "actions/github-script@v7",
          "with": {
            "script": "const {data:r}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:37854150199}); if(context.repo.owner!=='ankitpanda226' || context.repo.repo!=='revocable-flow' || r.path!=='.github/workflows/flash-lite-availability.yml' || r.head_sha!=='712193f0f48d4154e9fd087ae35a6f869f4e6438' || r.event!=='workflow_dispatch' || r.head_branch!=='main' || r.run_attempt!==1 || r.status!=='completed' || r.conclusion!=='success') throw new Error('Source run identity mismatch'); const p={source_run_id:r.id,source_run_url:r.html_url,source_head_sha:r.head_sha,source_run_attempt:r.run_attempt,source_workflow:r.path,source_event:r.event,source_branch:r.head_branch,source_conclusion:r.conclusion,source_created_at:r.created_at}; require('fs').writeFileSync(require('path').join(process.env.RUNNER_TEMP,'source-run.json'),JSON.stringify(p,null,2),{flag:'wx'});"
          }
        },
        {
          "name": "Download original diagnostic only",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "flash-lite-availability",
            "path": "${{ runner.temp }}/source-diagnostic",
            "github-token": "${{ github.token }}",
            "repository": "ankitpanda226/revocable-flow",
            "run-id": "37854150199"
          }
        },
        {
          "name": "Inspect and preserve original diagnostic bytes",
          "id": "inspect",
          "run": "python .github/scripts/preserve_flash_lite_diagnostic.py --source \"$RUNNER_TEMP/source-diagnostic\" --metadata \"$RUNNER_TEMP/source-run.json\" --destination \"$RUNNER_TEMP/preserved-diagnostic\" >> \"$GITHUB_OUTPUT\"",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Upload inspected evidence only",
          "if": "${{ steps.inspect.outputs.safe == 'true' }}",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "flash-lite-verified-evidence",
            "path": "${{ runner.temp }}/preserved-diagnostic/",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    }
  }
}
